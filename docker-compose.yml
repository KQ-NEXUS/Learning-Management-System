# Self-hosted deployment stack.
#
# The client runs the LMS on their own infrastructure, so this file — not a
# hosting provider's dashboard — is the deployment. Development uses Neon for
# convenience, but this path is the one that ships and must be exercised
# before launch, not after.
#
#   cp .env.example .env    # then set real secrets
#   docker compose up -d --build
#
# MinIO provides the S3-compatible private object storage required by
# PRD NFR-06: private buckets, short-lived authorized access, no public
# object paths.

x-storage-environment: &storage-environment
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_BUCKET: ${S3_BUCKET:-lms-private}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-lms-minio}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-minio}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_REGION: ${S3_REGION:-us-east-1}
  # Production (Cloudflare R2) changes environment only; the image is identical:
  # S3_ENDPOINT=https://<account-id>.r2.cloudflarestorage.com
  # S3_PUBLIC_ENDPOINT=https://<account-id>.r2.cloudflarestorage.com (or a custom domain)
  # S3_BUCKET=<your-r2-bucket>
  # S3_ACCESS_KEY_ID=<r2-api-token-access-key-id>
  # S3_SECRET_ACCESS_KEY=<r2-api-token-secret>
  # S3_FORCE_PATH_STYLE=false

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms} -d ${POSTGRES_DB:-lms}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the private bucket on first start. Public access is never
  # enabled. D-36 uses short-lived presigned URLs because MinIO and R2 expose
  # browser-resolvable public endpoints; application bytes do not proxy downloads.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${S3_BUCKET:-lms-private} &&
      mc anonymous set none local/${S3_BUCKET:-lms-private} &&
      echo 'bucket ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  # D-28: every uploaded lesson resource is scanned before it can be downloaded.
  # clamd needs approximately 1.2 GB just to load signatures, so keep an explicit
  # ceiling and persist the database to avoid a full freshclam download on restart.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # Reverse proxies must raise their request-body limit for video uploads (nginx
  # client_max_body_size defaults to 1 MB). Adding Next.js proxy.ts would impose
  # a 10 MB default that silently truncates oversized requests instead of failing.
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-lms}?schema=public
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      <<: *storage-environment
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_SENDER_NAME: ${EMAIL_SENDER_NAME:-Professional Training LMS}
      EMAIL_SENDER_ADDRESS: ${EMAIL_SENDER_ADDRESS:-no-reply@example.com}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}

  worker:
    build: .
    restart: unless-stopped
    command: ["npx", "tsx", "worker/index.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-lms}?schema=public
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      <<: *storage-environment
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}

volumes:
  postgres-data:
  minio-data:
  clamav-db:
