# Self-hosted deployment stack.
#
# The client runs the LMS on their own infrastructure, so this file — not a
# hosting provider's dashboard — is the deployment. Development uses Neon for
# convenience, but this path is the one that ships and must be exercised
# before launch, not after.
#
#   cp .env.example .env    # then set real secrets
#   docker compose up -d --build
#
# MinIO provides the S3-compatible private object storage required by
# PRD NFR-06: private buckets, short-lived authorized access, no public
# object paths.

x-storage-environment: &storage-environment
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_BUCKET: ${S3_BUCKET:-lms-private}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_REGION: ${S3_REGION:-us-east-1}
  # Production (Cloudflare R2) changes environment only; the image is identical:
  # S3_ENDPOINT=https://<account-id>.r2.cloudflarestorage.com
  # S3_PUBLIC_ENDPOINT=https://<account-id>.r2.cloudflarestorage.com (or a custom domain)
  # S3_BUCKET=<your-r2-bucket>
  # S3_ACCESS_KEY_ID=<r2-api-token-access-key-id>
  # S3_SECRET_ACCESS_KEY=<r2-api-token-secret>
  # S3_FORCE_PATH_STYLE=false

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # F-10 — loopback only: the app reaches Postgres over the compose
    # network; the host port exists for local tooling, never the internet.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms} -d ${POSTGRES_DB:-lms}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio-data:/data
    # F-10 — the admin console is loopback only. The S3 port must be reachable
    # by browsers (presigned URLs), so its bind address is configurable:
    # 127.0.0.1 for a single machine, 0.0.0.0 (or a proxy) when learners
    # upload from elsewhere.
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the private bucket on first start. Public access is never
  # enabled. D-36 uses short-lived presigned URLs because MinIO and R2 expose
  # browser-resolvable public endpoints; application bytes do not proxy downloads.
  #
  # F-10 — the app never holds the MinIO root credentials. This job creates
  # the app's own user (S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY) with a policy
  # limited to object read/write/delete in the one bucket, and refuses to run
  # if the app key is the root key.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      if [ \"$${S3_ACCESS_KEY_ID}\" = \"$${MINIO_ROOT_USER}\" ]; then
        echo 'S3_ACCESS_KEY_ID must differ from MINIO_ROOT_USER: give the app its own MinIO user.' >&2; exit 1;
      fi;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${S3_BUCKET};
      mc anonymous set none local/$${S3_BUCKET};
      printf '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:AbortMultipartUpload\",\"s3:ListMultipartUploadParts\"],\"Resource\":[\"arn:aws:s3:::%s/*\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:ListBucket\",\"s3:GetBucketLocation\"],\"Resource\":[\"arn:aws:s3:::%s\"]}]}' $${S3_BUCKET} $${S3_BUCKET} > /tmp/lms-app.json;
      mc admin policy create local lms-app /tmp/lms-app.json;
      mc admin user add local $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY};
      mc admin policy attach local lms-app --user $${S3_ACCESS_KEY_ID} || true;
      echo 'bucket and app user ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      S3_BUCKET: ${S3_BUCKET:-lms-private}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set}

  # F-10 — applies pending Prisma migrations before the app starts, so a new
  # image never serves against an old schema. Built from the builder stage,
  # which carries the Prisma CLI the slim runner image leaves out.
  migrate:
    build:
      context: .
      target: builder
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-lms}?schema=public

  # D-36: browsers upload lesson resources straight to private object storage
  # with short-lived presigned PUT URLs and download through short-lived
  # presigned GET URLs, so no file body traverses the app and there is no
  # request-body limit to raise on a reverse proxy.
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-lms}?schema=public
      <<: *storage-environment
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_SENDER_NAME: ${EMAIL_SENDER_NAME:-Professional Training LMS}
      EMAIL_SENDER_ADDRESS: ${EMAIL_SENDER_ADDRESS:-no-reply@example.com}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # Payment providers. Empty values keep the app booting, but checkout
      # refuses to start a payment on a rail whose keys are missing.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CONNECTED_ACCOUNT_ID: ${STRIPE_CONNECTED_ACCOUNT_ID:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_SUBACCOUNT_CODE: ${PAYSTACK_SUBACCOUNT_CODE:-}

volumes:
  postgres-data:
  minio-data:
